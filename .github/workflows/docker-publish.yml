name: Build & Push Docker Image on Tag

on:
  push:
    tags:
      - 'v*.*.*'        # Only trigger on semver tags like v1.0.0, v2.3.4

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # Needed to push to ghcr.io

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app                  # ← Dockerfile is in app/
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/geoip-api:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}/geoip-api:latest
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.version=${{ steps.tag.outputs.tag }}
            org.opencontainers.image.revision=${{ github.sha }}