# .github/workflows/docker-cd.yml
name: Build & Deploy on Tag

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Write Ansible Vault password file
        run: |
          echo "${{ secrets.ANSIBLE_VAULT_PASS }}" > ./caas/geoip-api/vault-pass.txt
          chmod 600 ./caas/geoip-api/vault-pass.txt

      - name: Install Ansible
        run: python3 -m pip install ansible

      - name: Run Ansible playbook from app/ directory
        run: |
          cd caas/geoip-api
          ansible-playbook playbooks/install-app.yml \
            --private-key ~/.ssh/id_rsa \
            --vault-password-file ./vault-pass.txt \
            -e "image_tag=${{ needs.build-and-push.outputs.tag }}" \
            -e "ansible_ssh_private_key_file=~/.ssh/id_rsa" \
            -e "ansible_user=ubuntu"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"