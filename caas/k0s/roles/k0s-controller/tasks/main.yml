- name: Reset previous installation
  import_tasks: "../k0s-common/tasks/reset.yml"
  become: true
  become_user: root
  when: reset_cluster is defined

- name: Ensure k0s config dir exists
  file:
    path: "{{ k0s_config_dir }}"
    state: directory
    mode: '0755'

- name: Render k0s.yaml
  template:
    src: k0s.yaml.j2
    dest: "{{ k0s_config_dir }}/k0s.yaml"
    mode: '0644'

- name: Check if k0s binary exists
  ansible.builtin.stat:
    path: /usr/local/bin/k0s
  register: k0s_bin

- name: Download k0s binary
  ansible.builtin.get_url:
    url: "https://github.com/k0sproject/k0s/releases/download/{{ k0s_version }}/k0s-{{ k0s_version }}-amd64"
    dest: /usr/local/bin/k0s
    mode: '0755'
  when: not k0s_bin.stat.exists

- name: Install k0s controller
  command: k0s install controller --enable-worker --config {{ k0s_config_dir }}/k0s.yaml
  register: install_out
  failed_when: install_out.rc != 0 and 'already' not in install_out.stderr|lower

- name: Start controller
  systemd:
    name: k0scontroller
    state: restarted
    enabled: true

- name: Wait for k0s controller to be ready
  wait_for:
    path: /run/k0s/status.sock
    state: present
    timeout: 60

- name: Create worker join token
  become: true
  command: k0s token create --role=worker
  register: worker_token
  run_once: true
  become_user: root
  args:
    executable: /bin/bash

- name: Store worker token as fact
  set_fact:
    k0s_worker_token: "{{ worker_token.stdout }}"
  run_once: true

- name: Create kubeconfig directory
  become: true
  file:
    path: "{{ home_directory }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0700'

- name: Get kubeconfig content
  become: true
  command: k0s kubeconfig admin
  register: kubeconfig_output
  changed_when: true

- name: Write kubeconfig file
  become: true
  copy:
    content: "{{ kubeconfig_output.stdout }}"
    dest: "{{ home_directory }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

- name: Ensure KUBECONFIG environment variable is set in bashrc
  lineinfile:
    path: ~/.bashrc
    line: 'export KUBECONFIG=$HOME/.kube/config'
    create: yes
  run_once: true

- name: Install helm
  include_role:
    name: kubectl-install

- name: Install helm
  include_role:
    name: helm-install

