apiVersion: "acid.zalan.do/v1"
kind: postgresql
metadata:
  name: postgres
  namespace: services
spec:
  dockerImage: ghcr.io/zalando/spilo-17:4.0-p2
  teamId: "sretest"
  numberOfInstances: 3
  users:  # Application/Robot users
    postgres-user:
    - superuser
    # foo_user: []
#    flyway: []
#  usersIgnoringSecretRotation:
#  - bar_user
#  usersWithSecretRotation:
#  - foo_user
#  usersWithInPlaceSecretRotation:
#  - flyway
#  - bar_owner_user
  enableMasterLoadBalancer: false
  enableReplicaLoadBalancer: false
  enableConnectionPooler: true # enable/disable connection pooler deployment
  enableReplicaConnectionPooler: true # set to enable connectionPooler for replica service
  enableMasterPoolerLoadBalancer: true
  enableReplicaPoolerLoadBalancer: true
  allowedSourceRanges:  # load balancers' source ranges for both master and replica services
  - 127.0.0.1/32
  databases:
    geoip: postgres-user
  # preparedDatabases:
  #   bar:
  #     defaultUsers: true
  #     extensions:
  #       pg_partman: public
  #       pgcrypto: public
  #     schemas:
  #       data: {}
  #       history:
  #         defaultRoles: true
  #         defaultUsers: false
  postgresql:
    version: "17"
    parameters:  # Expert section
      shared_buffers: "32MB"
      max_connections: "200"
      log_statement: "all"
      # logging_collector: "off"
      # log_min_error_statement: "fatal"
      # log_min_messages: "fatal"
  #     ssl: 'off'
  # env:
  #   - name: ALLOW_NOSSL
  #     value: 'true'

  volume:
    size: 3Gi
    storageClass: openebs-hostpath

  additionalVolumes:
    - name: empty
      mountPath: /opt/empty
      targetContainers:
        - all
      volumeSource:
        emptyDir: {}

  enableShmVolume: true

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
#      hugepages-2Mi: 128Mi
#      hugepages-1Gi: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi
#      hugepages-2Mi: 128Mi
#      hugepages-1Gi: 1Gi
  patroni:
    failsafe_mode: false
    initdb:
      encoding: "UTF8"
      locale: "en_US.UTF-8"
      data-checksums: "true"

    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    synchronous_mode: false
    synchronous_mode_strict: false
    synchronous_node_count: 1
    maximum_lag_on_failover: 33554432

  initContainers:
  - name: date
    image: busybox
    command: [ "/bin/date" ]
  sidecars:
  - name: "exporter"
    image: "quay.io/prometheuscommunity/postgres-exporter:latest"
    ports:
      - name: exporter
        containerPort: 9187
        protocol: TCP
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 200Mi
    env:
    - name: "DATA_SOURCE_URI"
      value: "$(POD_NAME)/postgres?sslmode=require"
    - name: "DATA_SOURCE_USER"
      value: "$(POSTGRES_USER)"
    - name: "DATA_SOURCE_PASS"
      value: "$(POSTGRES_PASSWORD)"
    - name: "PG_EXPORTER_AUTO_DISCOVER_DATABASES"
      value: "true"

# Custom TLS certificate. Disabled unless tls.secretName has a value.
  tls:
    secretName: ""  # should correspond to a Kubernetes Secret resource to load
    certificateFile: "tls.crt"
    privateKeyFile: "tls.key"
    caFile: ""  # optionally configure Postgres with a CA certificate
    caSecretName: "" # optionally the ca.crt can come from this secret instead.

  connectionPooler:
    numberOfInstances: 2
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi